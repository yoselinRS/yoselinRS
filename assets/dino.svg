<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" width="700" height="170" role="img" aria-label="Dinosaurio que corre y salta cactus" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Dinosaurio que corre y salta cactus</title>
<style>
.d{fill:#6e7781} .c{fill:#2ea043}
.jump{animation:jump 6s infinite}
.run{animation:hide-in-air 6s step-end infinite}
.stand{animation:show-in-air 6s step-end infinite}
.fa{animation:fa .36s step-end infinite}
.fb{animation:fb .36s step-end infinite}
.cactus{animation:move 6s linear infinite}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(-800px)}}
@keyframes jump{
 0%,68.3%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
 81.7%{transform:translateY(-80px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
 95%,100%{transform:translateY(0)}}
@keyframes hide-in-air{0%{opacity:1}68.3%{opacity:0}95%{opacity:1}}
@keyframes show-in-air{0%{opacity:0}68.3%{opacity:1}95%{opacity:0}}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(720,112)"><g class="cactus c"><rect x="42" y="0" width="6" height="6"/><rect x="12" y="6" width="6" height="6"/><rect x="42" y="6" width="6" height="6"/><rect x="54" y="6" width="6" height="6"/><rect x="12" y="12" width="6" height="6"/><rect x="42" y="12" width="6" height="6"/><rect x="54" y="12" width="6" height="6"/><rect x="0" y="18" width="6" height="6"/><rect x="12" y="18" width="6" height="6"/><rect x="30" y="18" width="6" height="6"/><rect x="42" y="18" width="6" height="6"/><rect x="54" y="18" width="6" height="6"/><rect x="0" y="24" width="6" height="6"/><rect x="12" y="24" width="6" height="6"/><rect x="30" y="24" width="30" height="6"/><rect x="0" y="30" width="18" height="6"/><rect x="42" y="30" width="6" height="6"/><rect x="12" y="36" width="6" height="6"/><rect x="42" y="36" width="6" height="6"/><rect x="12" y="42" width="6" height="6"/><rect x="42" y="42" width="6" height="6"/></g></g>
<g transform="translate(70,112)"><g class="jump d">
  <g class="stand"><rect x="42" y="0" width="18" height="6"/><rect x="42" y="6" width="18" height="6"/><rect x="18" y="12" width="6" height="6"/><rect x="42" y="12" width="18" height="6"/><rect x="18" y="18" width="6" height="6"/><rect x="42" y="18" width="6" height="6"/><rect x="18" y="24" width="30" height="6"/><rect x="18" y="30" width="30" height="6"/><rect x="24" y="36" width="18" height="6"/><rect x="24" y="42" width="6" height="6"/><rect x="36" y="42" width="6" height="6"/></g>
  <g class="run"><g class="fa"><rect x="42" y="0" width="18" height="6"/><rect x="42" y="6" width="18" height="6"/><rect x="18" y="12" width="6" height="6"/><rect x="42" y="12" width="18" height="6"/><rect x="18" y="18" width="6" height="6"/><rect x="42" y="18" width="6" height="6"/><rect x="18" y="24" width="30" height="6"/><rect x="18" y="30" width="30" height="6"/><rect x="24" y="36" width="18" height="6"/><rect x="24" y="42" width="6" height="6"/></g><g class="fb"><rect x="42" y="0" width="18" height="6"/><rect x="42" y="6" width="18" height="6"/><rect x="18" y="12" width="6" height="6"/><rect x="42" y="12" width="18" height="6"/><rect x="18" y="18" width="6" height="6"/><rect x="42" y="18" width="6" height="6"/><rect x="18" y="24" width="30" height="6"/><rect x="18" y="30" width="30" height="6"/><rect x="24" y="36" width="18" height="6"/><rect x="36" y="42" width="6" height="6"/></g></g>
</g></g>
</svg>